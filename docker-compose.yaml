services:
  app:
    build: .
    container_name: laradocker_app
    volumes:
      - .:/var/www/html

  nginx:
    image: nginx:latest
    container_name: laradocker_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app